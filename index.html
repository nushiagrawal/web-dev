<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>WebCraft Academy — Learn HTML, CSS &amp; JavaScript</title>
<meta name="description" content="An interactive slideshow platform for learning HTML, CSS and JavaScript." />

<!-- Optional web fonts (progressive enhancement — page works fully offline with fallback fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<a class="skip-link" href="#slideView">Skip to slide content</a>

<!-- ============ TOP NAVIGATION ============ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
    <span class="brand-name">WebCraft<span class="brand-name-accent">Academy</span></span>
  </div>

  <nav class="tabs" role="tablist" aria-label="Course topics">
    <button class="tab-btn is-active" data-topic="html" role="tab" aria-selected="true" id="tab-html" aria-controls="slideView">
      <span class="tab-dot tab-dot--html" aria-hidden="true"></span>
      HTML
    </button>
    <button class="tab-btn" data-topic="css" role="tab" aria-selected="false" id="tab-css" aria-controls="slideView">
      <span class="tab-dot tab-dot--css" aria-hidden="true"></span>
      CSS
    </button>
    <button class="tab-btn" data-topic="js" role="tab" aria-selected="false" id="tab-js" aria-controls="slideView">
      <span class="tab-dot tab-dot--js" aria-hidden="true"></span>
      JavaScript
    </button>
  </nav>

  <div class="topbar-hint" aria-hidden="true">
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> or <kbd>Space</kbd> to navigate
  </div>
</header>

<!-- ============ MAIN PRESENTATION AREA ============ -->
<main class="app">
  <div class="presentation" id="presentation">

    <div class="slide-stage" id="slideStage">
      <button class="stage-nav stage-nav--prev" id="stagePrev" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="slide-zoom-wrap" id="zoomWrap">
        <section class="slide" id="slideView" aria-live="polite"></section>
      </div>

      <button class="stage-nav stage-nav--next" id="stageNext" aria-label="Next slide">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- ============ CONTROLS BAR ============ -->
    <div class="controls-bar">
      <div class="controls-group controls-group--nav">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Prev</span>
        </button>
        <span class="slide-counter" id="slideCounter">1 / 8</span>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next slide">
          <span>Next</span>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="controls-group controls-group--tools">
        <button class="icon-btn" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button class="icon-btn" id="zoomInBtn" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="ctrl-divider" aria-hidden="true"></span>
        <button class="icon-btn" id="fullscreenBtn" aria-label="Enter fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- ============ THUMBNAIL STRIP ============ -->
    <div class="thumbnail-strip" id="thumbStrip" role="tablist" aria-label="Slide thumbnails"></div>

  </div>
</main>

<div class="fs-hint" id="fsHint" aria-hidden="true">
  <kbd>Esc</kbd> exit &nbsp;·&nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd><kbd>Space</kbd> navigate
</div>

<script src="script.js"></script>
</body>
</html>
